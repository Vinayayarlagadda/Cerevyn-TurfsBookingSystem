<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Turf</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="form-container">
	<h2>Add your turf. Let the goals do the talking 🥅🔥</h2>

    <h2>Add Turf</h2>
    <input type="text" id="turfName" placeholder="Turf Name">
    <input type="text" id="turfLocation" placeholder="Location">
    <input type="number" id="turfPrice" placeholder="Price per hour">
    <input type="text" id="turfImage" placeholder="Image URL">
    <button onclick="addTurf()">Add Turf</button>
    <p id="addTurfMessage"></p>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
